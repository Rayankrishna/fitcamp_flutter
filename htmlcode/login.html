<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#abaab4",
                        "surface-container-high": "#e8e8e8",
                        "secondary": "#5d5e66",
                        "tertiary": "#3a3c3d",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "outline": "#777777",
                        "on-primary-container": "#ffffff",
                        "tertiary-fixed-dim": "#454748",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#3a3b43",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#474747",
                        "primary-fixed-dim": "#474747",
                        "outline-variant": "#c6c6c6",
                        "primary": "#000000",
                        "on-primary-fixed": "#ffffff",
                        "inverse-primary": "#c6c6c6",
                        "inverse-on-surface": "#f0f1f1",
                        "on-tertiary-fixed": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#e2e2e3",
                        "surface-dim": "#dadada",
                        "on-secondary-fixed": "#1a1b22",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#c6c5cf",
                        "background": "#ffffff",
                        "on-background": "#1a1c1c",
                        "surface-container-low": "#f3f3f4",
                        "inverse-surface": "#2f3131",
                        "on-secondary-container": "#1a1b22",
                        "surface-container": "#eeeeee",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#e2e2e3",
                        "primary-container": "#3b3b3b",
                        "tertiary-fixed": "#5d5e60",
                        "on-primary": "#e2e2e2",
                        "surface-variant": "#e2e2e2",
                        "secondary-container": "#d4d3dd",
                        "surface": "#f9f9f9",
                        "on-error-container": "#410002",
                        "tertiary-container": "#737576",
                        "on-tertiary-container": "#ffffff",
                        "surface-tint": "#5e5e5e"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Outfit", "sans-serif"],
                        "body": ["DM Sans", "sans-serif"],
                        "label": ["DM Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #ffffff;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-surface min-h-screen flex flex-col">
    <!-- Suppressing Navigation Shell for Focused Transactional Intent (Login/Signup) -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12">
        <div class="w-full max-w-md flex flex-col items-center">
            <!-- Branding Section -->
            <div class="mb-16 text-center">
                <h1 class="font-outfit text-[36px] font-bold tracking-tighter text-primary">
                    FitCamp
                </h1>
                <p class="text-on-surface-variant font-body text-[16px] mt-2">
                    Elevate your performance.
                </p>
            </div>
            <!-- Form Section -->
            <div class="w-full space-y-4">
                <div class="space-y-2">
                    <label
                        class="font-label text-xs font-semibold uppercase tracking-widest px-6 text-on-surface-variant">Email</label>
                    <input
                        class="w-full h-14 bg-surface-container-low border-none rounded-lg px-8 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-high transition-all outline-none"
                        placeholder="your@email.com" type="email" />
                </div>
                <div class="space-y-2">
                    <label
                        class="font-label text-xs font-semibold uppercase tracking-widest px-6 text-on-surface-variant">Password</label>
                    <div class="relative">
                        <input
                            class="w-full h-14 bg-surface-container-low border-none rounded-lg px-8 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-high transition-all outline-none"
                            placeholder="••••••••" type="password" />
                        <button
                            class="absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary">
                            <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Action Section -->
                <div class="pt-8 space-y-4">
                    <button
                        class="w-full h-[56px] bg-primary text-on-primary-fixed rounded-full font-outfit text-lg font-semibold hover:opacity-90 active:scale-95 transition-all shadow-xl shadow-black/5">
                        Get Started
                    </button>
                    <button
                        class="w-full h-[56px] bg-surface-container-high text-primary rounded-full font-outfit text-lg font-semibold hover:bg-surface-container-highest active:scale-95 transition-all">
                        Already have an account? Log in
                    </button>
                </div>
            </div>
            <!-- Footer / Secondary Actions -->
            <div class="mt-12 text-center">
                <p class="text-on-surface-variant text-sm font-body">
                    By continuing, you agree to our
                    <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a>
                </p>
            </div>
        </div>
    </main>
    <!-- Visual Element: Subtle Kinetic Monolith Detail -->
    <div class="fixed bottom-0 left-0 w-full overflow-hidden pointer-events-none opacity-5 select-none">
        <h2
            class="font-outfit text-[20vw] leading-none font-extrabold text-primary whitespace-nowrap -mb-10 translate-x-10">
            PERFORMANCE
        </h2>
    </div>
</body>

</html>
